name: Web-only Deploy (GoTesty)

on:
  push:
    branches: [ main ]

jobs:
  build-deploy-web:
    runs-on: macos-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore Node cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: | 
            ${{ runner.os }}-node-

      - name: Install Go (needed for Wails CLI)
        uses: actions/setup-go@v6
        with:
          go-version: 1.26

      - name: Restore Go module cache
        uses: actions/cache@v6
        with:
          path: | 
            ~/go/pkg/mod ~/.cache/go-build
          key: ${{ runner.os }}-gomod-${{ hashFiles('**/go.sum') }}
          restore-keys: | 
            ${{ runner.os }}-gomod-

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Frontend & Build (via Wails)
        run: |
          # Wails will only run frontend install/build, skip desktop binary
          wails build -nopackage -clean
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
